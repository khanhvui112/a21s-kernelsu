name: KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex build-essential ccache curl libelf-dev libssl-dev python3 python3-pip git lzop device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld llvm

    - name: Clone Samsung A21s kernel source
      run: |
        git clone --depth=1 https://github.com/CyraxVip/SM-A217F-Kernel.git kernel_src

    - name: Clone KernelSU
      run: |
        git clone https://github.com/tiann/KernelSU.git --depth=1 --branch v0.9.5 || \
          git clone https://github.com/tiann/KernelSU.git --depth=1

    - name: Apply KernelSU patch
      run: |
        cd kernel_src
        ../KernelSU/kernel/setup.sh

    - name: Patch KernelSU for kernel 4.19 compatibility
      run: |
        cd kernel_src
        # Fix 1: MODULE_IMPORT_NS not in 4.19
        if [ -f drivers/kernelsu/core/init.c ]; then
          sed -i 's|^MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver)|//&|' drivers/kernelsu/core/init.c
        fi
        # Fix 2: linux/pgtable.h was added in 5.8, use asm/pgtable.h for older kernels
        find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
          's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} \;
        # Verify patches
        echo "--- after patches ---"
        grep -rn "MODULE_IMPORT_NS\|pgtable.h" drivers/kernelsu/ | head -10
        echo "---"

    - name: Build kernel (fail loudly)
      env:
        ARCH: arm64
        SUBARCH: arm64
        CROSS_COMPILE: aarch64-linux-gnu-
      run: |
        set -euxo pipefail
        cd kernel_src
        make exynos850-a21snsxx_defconfig
        # Disable -Werror to survive minor warnings
        scripts/config --file .config -d WERROR -d KCFLAGS_WERROR 2>/dev/null || true
        make -j$(nproc) Image

    - name: Show built artifacts
      if: always()
      run: |
        ls -la kernel_src/arch/arm64/boot/ 2>&1 || true
        find kernel_src -name "Image" -o -name "Image.gz" 2>&1 | head -10

    - name: Upload boot image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernelSU-boot
        path: |
          kernel_src/arch/arm64/boot/Image
          kernel_src/arch/arm64/boot/Image.gz
        if-no-files-found: error
